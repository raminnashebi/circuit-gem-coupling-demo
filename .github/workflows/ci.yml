name: CI

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned environment
        run: pip install -r requirements.txt
      - name: Rerun the whole pipeline
        run: make all
      - name: Check the regenerated results
        run: make test
